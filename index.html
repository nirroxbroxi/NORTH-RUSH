<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173e35">
  <meta name="description" content="North Rush : Édition Ultime & Admin">
  <title>North Rush - Édition Ultime & Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="menu">
  <canvas id="world"></canvas>
  <div id="menu-wash"></div>

  <header class="site-header">
    <div class="brand-cluster">
      <button class="brand" id="brand-home">
        <span class="brand-mark">NR</span>
        <span class="brand-words">NORTH<br>RUSH</span>
      </button>
    </div>
    <nav class="site-nav">
      <button class="nav-button active" data-open="home">JOUER</button>
      <button class="nav-button" data-open="shop">BOUTIQUE</button>
      <button class="nav-button" data-open="pass">PASSE</button>
      <button class="nav-button" data-open="profile">PROFIL & ADMIN</button>
    </nav>
    <div class="header-actions">
      <div class="wallet">💰 <span data-balance>250</span></div>
      <button class="icon-button" data-open="scores" title="Classement">🏆</button>
    </div>
  </header>

  <main class="hero" id="home-screen">
    <h1>NORTH<br>RUSH<span class="title-dot">.</span></h1>
    <p class="hero-copy">Choisis ton mode et affronte le Pôle Nord ou la Lave en fusion !</p>
    <div class="mode-select">
      <button class="mode-tab active" id="btn-mode-classic">CLASSIQUE</button>
      <button class="mode-tab" id="btn-mode-lava">🌋 FLOOR IS LAVA</button>
    </div>
    <button class="primary-button" id="start-button" style="margin-top:16px">▶ C'EST PARTI</button>
  </main>

  <div id="run-hud" hidden>
    <div class="score-wrap">
      <div style="font-size:9px;letter-spacing:2px;color:var(--lime)">SCORE</div>
      <div class="score-number" id="score">00000</div>
      <div id="hud-mode-label" style="font-size:10px;font-weight:bold;color:#ffd700"></div>
    </div>
  </div>

  <div class="screen-overlay" id="dialog-layer" hidden>
    <section class="dialog" id="dialog-content-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 id="dialog-title" style="font-family:var(--display);font-size:36px;margin:0"></h2>
        <button id="dialog-close" style="background:none;color:#fff;font-size:20px;cursor:pointer">✕</button>
      </div>
      <div id="dialog-body"></div>
    </section>
  </div>

  <div class="screen-overlay" id="over-screen" hidden>
    <section class="state-panel" style="text-align:center">
      <h2 style="font-family:var(--display);font-size:48px;margin-bottom:10px">FIN DE PARTIE</h2>
      <p id="over-reason" style="color:#b0c4de;margin-bottom:20px"></p>
      <div style="font-size:32px;font-family:var(--display);color:var(--lime);margin-bottom:20px" id="final-score">0 PTS</div>
      <button class="primary-button" id="restart-button">REJOUER</button>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
