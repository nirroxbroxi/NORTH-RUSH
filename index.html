<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173e35">
  <meta name="description" content="North Rush : un runner 3D au Pole Nord.">
  <title>North Rush - Édition Ultime & Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root{--ink:#173e35;--lime:#d0fa78;--snow:#f1f6f3;--dark:#102d28;--display:'Barlow Condensed',Impact,sans-serif;--sans:'DM Sans',Arial,sans-serif;--mono:'Space Mono',monospace}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
    body{font-family:var(--sans);color:#f3f8fc;background:#0d2138;touch-action:none;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default}
    [hidden]{display:none!important}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    #world{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;display:block;outline:none}
    #menu-wash{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(8,22,38,.85) 0%,rgba(8,22,38,.6) 30%,transparent 60%);transition:opacity .7s}
    .site-header{position:fixed;z-index:30;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:20px 3vw;gap:20px}
    .brand{display:flex;align-items:center;gap:10px;color:#f4f9fc;text-decoration:none;background:none;padding:0}
    .brand-mark{height:36px;width:36px;display:grid;place-items:center;background:var(--lime);border-radius:9px;color:var(--ink);font-weight:900}
    .brand-words{font-family:var(--display);font-size:20px;font-weight:800;line-height:.86;letter-spacing:.7px;text-align:left}
    .site-nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:5px 8px;border-radius:12px;background:rgba(11,29,48,.75);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px)}
    .nav-button{background:transparent;padding:8px 12px;border-radius:8px;color:#c5daea;font-size:10px;font-weight:800;letter-spacing:1px;transition:.2s}
    .nav-button:hover,.nav-button.active{color:var(--ink);background:var(--lime)}
    .header-actions{display:flex;align-items:center;gap:10px}
    .wallet{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(12,31,50,.8);color:#f5fafc;font-weight:800}
    .icon-button{height:38px;width:38px;display:grid;place-items:center;background:rgba(12,31,50,.7);border:1px solid rgba(255,255,255,.16);color:#f3f8fc;border-radius:8px}
    .hero{position:fixed;z-index:20;left:4vw;top:52%;width:380px;padding:26px;border-radius:18px;background:rgba(10,27,44,.8);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);transform:translateY(-46%)}
    h1{margin:0;font-family:var(--display);font-size:82px;font-weight:800;line-height:.85;color:#fff}
    .title-dot{color:var(--lime)}
    .hero-copy{font-size:13px;line-height:1.6;color:#d0e2f0;margin:16px 0}
    .primary-button{width:100%;height:56px;border-radius:9px;background:var(--lime);color:var(--ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 4px 0 rgba(73,108,38,.4)}
    .mode-select{display:flex;gap:8px;margin-top:12px}
    .mode-tab{flex:1;padding:10px;border-radius:8px;background:rgba(255,255,255,.08);color:#c5daea;font-size:10px;font-weight:800;border:1px solid rgba(255,255,255,.12);text-align:center}
    .mode-tab.active{background:var(--lime);color:var(--ink);border-color:var(--lime)}
    #run-hud{position:fixed;inset:0;z-index:15;pointer-events:none;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
    .score-wrap{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
    .score-number{font-family:var(--display);font-size:52px;font-weight:700}
    .screen-overlay{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(12,37,31,.4);backdrop-filter:blur(9px);padding:24px}
    .state-panel{width:420px;max-width:100%;padding:35px;background:var(--dark);color:#f2f7ea;border-radius:16px;border:1px solid rgba(255,255,255,.15)}
    .dialog{width:min(100%,900px);max-height:85vh;overflow-y:auto;background:var(--dark);border:1px solid rgba(255,255,255,.15);color:#f2f7eb;border-radius:16px;padding:25px}
    input[type="text"],input[type="password"]{width:100%;padding:12px;margin:8px 0 16px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff}
    .admin-badge{background:linear-gradient(135deg,#ffd700,#ff4500);color:#000;font-weight:900;padding:4px 8px;border-radius:4px;font-size:10px;display:inline-block}
  </style>
</head>
<body data-state="menu">
  <canvas id="world"></canvas>
  <div id="menu-wash"></div>

  <header class="site-header">
    <div class="brand-cluster">
      <button class="brand" id="brand-home">
        <span class="brand-mark">NR</span>
        <span class="brand-words">NORTH<br>RUSH</span>
      </button>
    </div>
    <nav class="site-nav">
      <button class="nav-button active" data-open="home">JOUER</button>
      <button class="nav-button" data-open="shop">BOUTIQUE</button>
      <button class="nav-button" data-open="pass">PASSE</button>
      <button class="nav-button" data-open="profile">PROFIL & ADMIN</button>
    </nav>
    <div class="header-actions">
      <div class="wallet">💰 <span data-balance>250</span></div>
      <button class="icon-button" data-open="scores" title="Classement">🏆</button>
    </div>
  </header>

  <main class="hero" id="home-screen">
    <h1>NORTH<br>RUSH<span class="title-dot">.</span></h1>
    <p class="hero-copy">Choisis ton mode et affronte le Pôle Nord ou la Lave en fusion !</p>
    <div class="mode-select">
      <button class="mode-tab active" id="btn-mode-classic">CLASSIQUE</button>
      <button class="mode-tab" id="btn-mode-lava">🌋 FLOOR IS LAVA</button>
    </div>
    <button class="primary-button" id="start-button" style="margin-top:16px">▶ C'EST PARTI</button>
  </main>

  <div id="run-hud" hidden>
    <div class="score-wrap">
      <div style="font-size:9px;letter-spacing:2px;color:var(--lime)">SCORE</div>
      <div class="score-number" id="score">00000</div>
      <div id="hud-mode-label" style="font-size:10px;font-weight:bold;color:#ffd700"></div>
    </div>
  </div>

  <div class="screen-overlay" id="dialog-layer" hidden>
    <section class="dialog" id="dialog-content-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 id="dialog-title" style="font-family:var(--display);font-size:36px;margin:0"></h2>
        <button id="dialog-close" style="background:none;color:#fff;font-size:20px">✕</button>
      </div>
      <div id="dialog-body"></div>
    </section>
  </div>

  <div class="screen-overlay" id="over-screen" hidden>
    <section class="state-panel" style="text-align:center">
      <h2 style="font-family:var(--display);font-size:48px;margin-bottom:10px">FIN DE PARTIE</h2>
      <p id="over-reason" style="color:#b0c4de;margin-bottom:20px"></p>
      <div style="font-size:32px;font-family:var(--display);color:var(--lime);margin-bottom:20px" id="final-score">0 PTS</div>
      <button class="primary-button" id="restart-button">REJOUER</button>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      let save = JSON.parse(localStorage.getItem('north_rush_save') || JSON.stringify({
        coins: 500, xp: 0, skin: 'frost', cape: 'none', mode: 'classic',
        user: { name: 'Joueur', loggedAdmin: false }, scores: [], owned: ['frost']
      }));

      function persist() { localStorage.setItem('north_rush_save', JSON.stringify(save)); }
      function updateUI() { document.querySelectorAll('[data-balance]').forEach(el => el.textContent = save.coins); }

      // Système de connexion Admin (Nirrox / Jibier avec mot de passe Giuliano2013)
      function checkAdminLogin(username, password) {
        if ((username === 'Nirrox' || username === 'Jibier') && password === 'Giuliano2013') {
          save.user.name = username;
          save.user.loggedAdmin = true;
          if (!save.owned.includes('admin_skin')) save.owned.push('admin_skin');
          save.skin = 'admin_skin';
          save.cape = 'admin_cape';
          persist();
          alert('Connexion Admin réussie ! Skin et Cape Admin débloqués.');
          closeDialog();
        } else {
          alert('Identifiants ou mot de passe incorrects.');
        }
      }

      // Gestion des dialogues
      function openDialog(type) {
        $('dialog-layer').hidden = false;
        let title = '', html = '';
        if (type === 'profile') {
          title = 'PROFIL & CONNEXION ADMIN';
          html = `
            <div>Statut : ${save.user.loggedAdmin ? '<span class="admin-badge">ADMINISTRATEUR</span>' : 'Joueur Standard'} (${save.user.name})</div>
            ${!save.user.loggedAdmin ? `
              <div style="margin-top:20px">
                <h3>Connexion Testeur / Admin</h3>
                <label>Pseudo (Nirrox / Jibier) :</label>
                <input type="text" id="adm-user" placeholder="Pseudo">
                <label>Mot de passe :</label>
                <input type="password" id="adm-pass" placeholder="Mot de passe">
                <button class="primary-button" id="btn-login-admin">Se connecter en Admin</button>
              </div>
            ` : `<div style="margin-top:20px;color:var(--lime)">Vous êtes connecté en tant qu'Administrateur avec tous les privilèges !</div>`}
          `;
        } else if (type === 'scores') {
          title = 'CLASSEMENT & MODÉRATION';
          html = `<div>${save.scores.length ? save.scores.map((s, i) => `<div>#${i+1} - ${s.score} pts (${s.mode}) ${save.user.loggedAdmin ? `<button onclick="deleteScore(${i})" style="color:red;background:none;border:none;cursor:pointer">Supprimer</button>` : ''}</div>`).join('') : 'Aucun score enregistré.'}</div>`;
        } else if (type === 'shop') {
          title = 'BOUTIQUE';
          html = `<div>Skins & Capes disponibles. (Le coffre méga-rare en jeu débloque tout gratuitement !).</div>`;
        } else if (type === 'pass') {
          title = 'PASSE DE COMBAT (3 PAGES)';
          html = `<div>Paliers 1 à 30 disponibles.</div>`;
        }
        $('dialog-title').textContent = title;
        $('dialog-body').innerHTML = html;

        if($('btn-login-admin')) {
          $('btn-login-admin').onclick = () => {
            checkAdminLogin($('adm-user').value.trim(), $('adm-pass').value.trim());
          };
        }
      }
      function closeDialog() { $('dialog-layer').hidden = true; }

      document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openDialog(b.dataset.open)));
      $('dialog-close').onclick = closeDialog;

      // Bascule de mode
      $('btn-mode-classic').onclick = () => { save.mode = 'classic'; $('btn-mode-classic').classList.add('active'); $('btn-mode-lava').classList.remove('active'); persist(); };
      $('btn-mode-lava').onclick = () => { save.mode = 'lava'; $('btn-mode-lava').classList.add('active'); $('btn-mode-classic').classList.remove('active'); persist(); };

      // Moteur 3D Three.js
      let scene, camera, renderer, player, obstacles = [], gameActive = false, score = 0;
      const LANES = [-3, 0, 3];

      function init3D() {
        renderer = new THREE.WebGLRenderer({ canvas: $('world'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 4, 12);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Création joueur
        const geom = new THREE.BoxGeometry(0.8, 1.8, 0.8);
        const mat = new THREE.MeshStandardMaterial({ color: save.user.loggedAdmin ? 0xffd700 : 0x00ffcc });
        player = new THREE.Mesh(geom, mat);
        player.position.set(0, 0.9, 5);
        scene.add(player);

        updateEnvironmentTheme();
      }

      function updateEnvironmentTheme() {
        if (save.mode === 'lava') {
          scene.background = new THREE.Color(0x3a0505);
          // Sol de lave
          if(window.lavaMesh) scene.remove(window.lavaMesh);
          const lavaGeo = new THREE.PlaneGeometry(100, 300);
          const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
          window.lavaMesh = new THREE.Mesh(lavaGeo, lavaMat);
          window.lavaMesh.rotation.x = -Math.PI / 2;
          window.lavaMesh.position.y = -0.5;
          window.lavaMesh.position.z = -100;
          scene.add(window.lavaMesh);
        } else {
          scene.background = new THREE.Color(0x0f253e);
          if(window.lavaMesh) scene.remove(window.lavaMesh);
        }
      }

      function startGame() {
        $('home-screen').hidden = true;
        $('run-hud').hidden = false;
        score = 0;
        gameActive = true;
        updateEnvironmentTheme();
        $('hud-mode-label').textContent = save.mode === 'lava' ? '🌋 FLOOR IS LAVA (Pas de sol !)' : '❄️ CLASSIQUE';
      }

      $('start-button').onclick = startGame;
      $('restart-button').onclick = () => { $('over-screen').hidden = true; startGame(); };

      // Commandes tactiles et clavier
      let currentLane = 1;
      window.addEventListener('keydown', e => {
        if (!gameActive) return;
        if ((e.key === 'ArrowLeft' || e.key === 'q') && currentLane > 0) currentLane--;
        if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) currentLane++;
        player.position.x = LANES[currentLane];
      });

      init3D();
      updateUI();
      renderer.setAnimationLoop(() => {
        if (gameActive) {
          score += 10;
          $('score').textContent = String(score).padStart(5, '0');
        }
        renderer.render(scene, camera);
      });
    })();
  </script>
</body>
</html>
