<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173e35">
  <meta name="description" content="North Rush : runner 3D au Pôle Nord avec mode Floor is Lava, capes Top 1, Passe de Combat 30 paliers et Firebase.">
  <title>North Rush - Édition Complète & Firebase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root{
      --ink:#173e35;--lime:#d0fa78;--snow:#f1f6f3;--muted:#b9d1e4;
      --line:rgba(255,255,255,.18);--dark:#102d28;--cyan:#6ef7e8;--gold:#ffd257;--cosmic:#c89aff;--lava:#ff5a26;
      --display:'Barlow Condensed',Impact,sans-serif;--sans:'DM Sans',Arial,sans-serif;--mono:'Space Mono',monospace
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
    body{font-family:var(--sans);color:#f3f8fc;background:#0d2138;touch-action:none;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default}
    button{border:0}button:focus-visible,input:focus-visible{outline:3px solid #a4d457;outline-offset:4px}
    [hidden]{display:none!important}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    #world{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;display:block;outline:none}
    #menu-wash{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(8,22,38,.86) 0%,rgba(8,22,38,.62) 30%,rgba(8,22,38,.18) 52%,transparent 70%);transition:opacity .7s}
    #edge-shade{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 -110px 130px -90px rgba(6,16,28,.75),inset 0 90px 110px -80px rgba(6,16,28,.55)}

    /* Header & Navigation */
    .site-header{position:fixed;z-index:30;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:20px 3vw;gap:14px}
    .brand-cluster{display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;color:#f4f9fc;text-decoration:none;background:none;padding:0;text-shadow:0 2px 10px rgba(0,0,0,.35)}
    .brand-mark{height:38px;width:38px;display:grid;place-items:center;background:var(--lime);border-radius:9px;transform:rotate(-5deg);color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.28)}
    .brand-mark svg{width:28px;height:28px}.brand-words{font-family:var(--display);font-size:20px;font-weight:800;line-height:.86;letter-spacing:.7px;text-align:left}
    .guard-badge{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid rgba(110,247,232,.35);border-radius:999px;background:rgba(11,36,44,.76);backdrop-filter:blur(10px);color:#cffaf6;font-family:var(--mono);font-size:8.5px;white-space:nowrap}
    .status-dot{height:6px;width:6px;background:var(--cyan);border-radius:50%;box-shadow:0 0 8px var(--cyan)}

    .site-nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:5px 7px;border-radius:12px;background:rgba(11,29,48,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px)}
    .nav-button{position:relative;background:transparent;padding:8px 13px;border-radius:8px;color:#c5daea;font-size:10px;font-weight:800;letter-spacing:1px;white-space:nowrap;transition:color .2s,background .2s}
    .nav-button:hover,.nav-button.active{color:var(--ink);background:var(--lime)}

    .header-actions{display:flex;align-items:center;gap:8px}
    .profile-chip{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;border-radius:9px;background:rgba(12,31,50,.82);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);color:#f4f9fc}
    .profile-avatar{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;background:linear-gradient(135deg,#275b4c,#173747)}
    .profile-meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;text-align:left}
    .profile-name{font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px}
    .top1-crown{background:linear-gradient(90deg,#ffd257,#ff9f2e);color:#1d1504;font-family:var(--mono);font-size:7px;padding:1.5px 5px;border-radius:4px}
    .profile-rank{font-family:var(--mono);font-size:8px;color:#a5c4d8}

    .wallet{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:1px solid rgba(255,255,255,.22);border-radius:9px;background:rgba(12,31,50,.76);backdrop-filter:blur(12px);color:#f5fafc;min-width:86px}
    .wallet .icon{color:var(--gold);width:18px;height:18px}.wallet-value{font-size:13.5px;font-weight:800}
    .icon-button{height:38px;width:38px;display:grid;place-items:center;background:rgba(12,31,50,.72);border:1px solid rgba(255,255,255,.16);color:#f3f8fc;border-radius:8px;backdrop-filter:blur(10px)}
    .icon-button .icon{width:18px;height:18px}.pause-button{display:none;background:var(--lime);color:var(--ink);border-color:transparent;width:40px;height:40px}

    /* Hero & Mode Selector */
    .hero{position:fixed;z-index:20;left:3.6vw;top:52%;width:420px;max-height:calc(100dvh - 132px);overflow-y:auto;scrollbar-width:none;padding:22px 25px;border-radius:18px;background:rgba(10,27,44,.78);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(15px);transform:translateY(-47%)}
    .eyebrow{display:flex;align-items:center;gap:9px;font-size:9.5px;font-weight:800;letter-spacing:2px;color:var(--lime);margin-bottom:10px}
    h1{margin:0;font-family:var(--display);font-size:clamp(70px,7.2vw,100px);font-weight:800;line-height:.82;color:#ffffff}
    .title-dot{color:var(--lime)}
    .hero-copy{font-size:13px;line-height:1.55;color:#d0e2f0;margin:11px 0 15px}
    .primary-button{height:54px;border-radius:9px;background:var(--lime);color:var(--ink);font-size:13px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 21px;width:100%}
    .primary-button.lava-btn{background:linear-gradient(135deg,#ff7733,#ff3b1f);color:#fff}

    .mode-selector{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
    .mode-selector-label{font-family:var(--mono);font-size:8px;letter-spacing:1.2px;color:#9bbad0;margin-bottom:7px;display:flex;justify-content:space-between}
    .mode-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .mode-pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px 7px;text-align:left;color:#d6e7f5;display:flex;flex-direction:column;gap:3px}
    .mode-pill.active{background:rgba(208,250,120,.16);border-color:var(--lime);color:#fff}
    .mode-pill.active.lava-mode{background:rgba(255,90,38,.22);border-color:#ff6d3b;color:#fff}
    .mode-pill-top{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800}
    .mode-pill-mult{font-family:var(--mono);font-size:8px;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.35);color:var(--lime)}
    .mode-pill-desc{font-size:8.5px;color:#a5bfd4}

    /* HUD */
    #run-hud{position:fixed;inset:0;z-index:15;pointer-events:none;color:#ffffff}
    .score-wrap{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
    .score-label{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--lime)}
    .score-number{font-family:var(--display);font-size:54px;font-weight:700}
    .run-mode{font-size:9px;font-weight:800;letter-spacing:1px;margin-top:3px}
    #lava-meter{position:absolute;left:50%;top:138px;transform:translateX(-50%);width:220px;background:rgba(34,11,8,.84);border:1px solid rgba(255,107,61,.55);border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:8px}
    .lava-meter-label{font-family:var(--mono);font-size:8px;color:#ff9c73;white-space:nowrap}
    .lava-meter-track{flex:1;height:5px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
    .lava-meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffae33,#ff3311)}
    .run-coin-count{position:absolute;left:3vw;top:96px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}.run-coin-count .icon{color:var(--gold)}
    .distance-readout{position:absolute;bottom:64px;right:3vw;font-family:var(--mono);font-size:19px}

    /* Dialogs & Shop */
    .screen-overlay{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(12,37,31,.42);backdrop-filter:blur(9px);padding:20px}
    .state-panel{position:relative;width:455px;max-width:100%;padding:34px;background:var(--dark);color:#f2f7ea;border-radius:17px;border:1px solid rgba(255,255,255,.12)}
    .dialog{width:min(100%,1060px);max-height:calc(100dvh - 54px);overflow-y:auto;background:var(--dark);border:1px solid rgba(217,239,203,.14);color:#f2f7eb;border-radius:18px;padding:20px 28px 28px}
    .dialog-title{font-family:var(--display);font-size:42px;font-weight:700;margin:8px 0 6px}
    .shop-tabs{display:flex;gap:8px;border-bottom:1px solid #2b483a;padding-bottom:12px;margin-bottom:16px}
    .shop-tab{padding:9px 16px;border-radius:8px;background:rgba(255,255,255,.05);color:#b7ccb9;font-size:11px;font-weight:800}
    .shop-tab.active{background:var(--lime);color:var(--ink)}
    .skin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
    .skin-card{background:#1a382f;border:1px solid #2c4b3b;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
    .skin-art{height:130px;position:relative;background:#254536;display:grid;place-items:center;font-size:32px}
    .skin-info{padding:12px;display:flex;flex-direction:column;flex:1}
    .skin-buy{margin-top:auto;width:100%;height:33px;border-radius:5px;background:#ccf28b;color:#183b29;font-size:9.5px;font-weight:800}

    /* Leaderboard */
    .leaderboard-head,.leaderboard-row{display:grid;grid-template-columns:42px 1fr 96px 100px 76px;gap:10px;align-items:center}
    .leaderboard-head{font-size:8px;letter-spacing:1px;color:#849f89;margin-top:20px;padding:0 10px 10px;border-bottom:1px solid #34513d}
    .leaderboard-row{padding:12px 10px;border-bottom:1px solid #294734;font-size:11px}
    .rank{font-family:var(--mono);color:#92b085}.leader-score{font-family:var(--display);font-size:20px;font-weight:600}

    #toast-stack{position:fixed;z-index:80;bottom:74px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{display:flex;align-items:center;gap:9px;background:#183e30;color:#ecf7df;border:1px solid #527344;padding:11px 17px;border-radius:8px;font-size:11px}

    body:not([data-state=menu]) #menu-wash{opacity:0}body:not([data-state=menu]) .hero{opacity:0;pointer-events:none}body:not([data-state=menu]) .site-nav{display:none}body:not([data-state=menu]) .pause-button{display:grid}body[data-state=menu] #run-hud{display:none}
  </style>
</head>
<body data-state="menu">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden"><defs>

  <canvas id="world"></canvas>

  <header class="site-header">
    <div class="brand-cluster">
      <button class="brand" id="brand-home">
        <span class="brand-mark"><svg viewBox="0 0 40 40"><path d="M7 31 19 7h5l10 24H23l-5-12-6 12Z" fill="currentColor"/><path d="m24 7-5 10 5 11 5-10Z" fill="#173e35"/></svg></span>
        <span class="brand-words">NORTH<br>RUSH</span>

      <div class="guard-badge"><span class="status-dot"></span>NORTHGUARD™ ACTIF</div>

    <nav class="site-nav">

      <button class="profile-chip" data-open="profile">

  <main class="hero" id="home-screen">
    <div class="eyebrow"><svg class="icon"><use href="#i-snow"/></svg>SAISON VOLCANIQUE & V2 JANVIER</div>
    <h1>NORTH<br>RUSH<span class="title-dot">.</span></h1>
    <p class="hero-copy">Brise la glace, survole le magma en fusion et décroche la <strong>Cape Royale TOP 1</strong>.</p>
    <button class="primary-button" id="start-button">
      <span style="display:flex;align-items:center;gap:10px"><svg class="icon"><use href="#i-play"/></svg><span id="start-label">C'EST PARTI</span></span>
      <svg class="icon"><use href="#i-right"/></svg>
    </button>

    <div class="mode-selector">
      <div class="mode-selector-label"><span>MODE DE JEU</span><span id="mode-summary">CLASSIQUE</span></div>
      <div class="mode-pills">
        <button class="mode-pill active" data-mode="classic"><span class="mode-pill-top"><span>❄️ Classique</span><span class="mode-pill-mult">×1</span></span><span class="mode-pill-desc">Rails enneigés.</span></button>
        <button class="mode-pill" data-mode="nocoin"><span class="mode-pill-top"><span>🚫 Sans Pièce</span><span class="mode-pill-mult">×2</span></span><span class="mode-pill-desc">Saut barrière.</span></button>
        <button class="mode-pill lava-mode" data-mode="lava"><span class="mode-pill-top"><span>🌋 Floor is Lava</span><span class="mode-pill-mult">×2.5</span></span><span class="mode-pill-desc">Vraie lave !</span></button>
      </div>
    </div>
  </main>

  <div id="run-hud" hidden>
    <div class="score-wrap">
      <div class="score-label">SCORE</div>
      <div class="score-number" id="score">00000</div>
      <div class="run-mode" id="run-mode"></div>
    </div>
    <div id="lava-meter" hidden><span class="lava-meter-label">🔥 CHALEUR LAVE</span><div class="lava-meter-track"><div class="lava-meter-fill" id="lava-meter-fill"></div></div></div>
    <div class="run-coin-count"><svg class="icon"><use href="#i-coin"/></svg><span id="run-coins">0</span></div>
    <div class="distance-readout"><b id="distance">0</b><span>M</span></div>
  </div>

  <div class="screen-overlay" id="pause-screen" hidden>
    <section class="state-panel"><h2>PAUSE</h2><button class="primary-button" id="resume-button">REPRENDRE</button></section>
  </div>

  <div class="screen-overlay" id="over-screen" hidden>
    <section class="state-panel">
      <h2>FIN DE COURSE</h2>
      <div style="font-size:40px;font-weight:700;color:var(--lime);margin:15px 0" id="final-score">0 PTS</div>
      <button class="primary-button" id="restart-button">REJOUER</button>
      <button class="secondary-button" id="over-home" style="width:100%;margin-top:10px;background:rgba(255,255,255,.05);padding:12px;border-radius:8px">ACCUEIL</button>
    </section>
  </div>

  <div class="screen-overlay" id="dialog-layer" hidden>
    <section class="dialog" id="dialog">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <span id="dialog-kicker" style="font-size:9px;color:var(--lime);letter-spacing:2px"></span>
        <button id="dialog-close" style="background:none;color:#fff;font-size:18px">✕</button>
      </div>
      <div id="dialog-content"></div>
    </section>
  </div>

  <div id="toast-stack"></div>

  <!-- Scripts Firebase & Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_3kk4QDjUwNbiZvw3F7zhIrDkU-GIrj4",
      authDomain: "north-rush-a88b5.firebaseapp.com",
      projectId: "north-rush-a88b5",
      storageBucket: "north-rush-a88b5.firebasestorage.app",
      messagingSenderId: "796135776651",
      appId: "1:796135776651:web:54131c29c023f1b641cf8e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveScoreToFirebase = async function(username, score, mode) {
      try {
        await addDoc(collection(db, "scores"), { name: username, score, mode, date: Date.now() });
      } catch (e) { console.error("Erreur Firebase :", e); }
    };

    window.loadFirebaseLeaderboard = async function() {
      try {
        const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(10));
        const snapshot = await getDocs(q);
        const list = [];
        snapshot.forEach(doc => list.push(doc.data()));
        return list;
      } catch (e) { return []; }
    };
  </script>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const fmt = n => Math.floor(n).toLocaleString('fr-FR');
    const clamp = (n,a,b) => Math.max(a,Math.min(b,n));

    const SKINS = [
      {id:'frost',name:"P'tit Givré",price:0,color:0xcf493f,emoji:'🐧'},
      {id:'evergreen',name:'Lutin Express',price:600,color:0x4c986c,emoji:'🎄'},
      {id:'yeti',name:'Yéti Blanc',price:1100,color:0xe4eff7,emoji:'❄️'},
      {id:'magma',name:'Magma Core',price:1600,color:0xff511a,emoji:'🌋'},
      {id:'phoenix',name:'Phénix',price:2400,color:0xff9924,emoji:'🔥'},
      {id:'nebula',name:'Nebula',price:1500,color:0x9c5df0,emoji:'🌌'}
    ];

    let save = { username: 'Invité Polaire', coins: 350, equipped: 'frost', owned: ['frost'], gameMode: 'classic' };

    function updateEconomy() {
      document.querySelectorAll('[data-balance]').forEach(el => el.textContent = fmt(save.coins));
      $('hdr-username').textContent = save.username;
    }

    document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
      save.gameMode = b.dataset.mode;
      document.querySelectorAll('.mode-pill').forEach(p => p.classList.toggle('active', p.dataset.mode === save.gameMode));
      $('mode-summary').textContent = save.gameMode === 'lava' ? 'FLOOR IS LAVA' : save.gameMode === 'nocoin' ? 'SANS PIÈCE' : 'CLASSIQUE';
    }));

    function openDialog(which) {
      if(which === 'scores') {
        $('dialog-kicker').textContent = 'CLASSEMENT MONDIAL';
        $('dialog-content').innerHTML = 'Chargement...';
        $('dialog-layer').hidden = false;
        window.loadFirebaseLeaderboard().then(board => {
          $('dialog-content').innerHTML = `<div class="leaderboard-head"><span>RANG</span><span>JOUEUR</span><span>SCORE</span><span>MODE</span><span style="text-align:right">DATE</span></div>` +
          board.map((r,i) => `<div class="leaderboard-row"><span class="rank">#${i+1}</span><span>${r.name}</span><span class="leader-score">${fmt(r.score)}</span><span>${r.mode}</span><span style="text-align:right">${new Date(r.date).toLocaleDateString()}</span></div>`).join('');
        });
      } else if(which === 'shop') {
        $('dialog-kicker').textContent = 'BOUTIQUE';
        $('dialog-content').innerHTML = `<div class="skin-grid">${SKINS.map(s => {
          const owned = save.owned.includes(s.id), equipped = save.equipped === s.id;
          return `<div class="skin-card">
            <div class="skin-art">${s.emoji}</div>
            <div class="skin-info">
              <h3 style="font-size:12px;margin:0 0 8px">${s.name}</h3>
              <button class="skin-buy" onclick="window.buySkin('${s.id}')" ${equipped?'disabled':''}>${equipped?'ÉQUIPÉ':owned?'ÉQUIPER':s.price+' 💰'}</button>
            </div>
          </div>`;
        }).join('')}</div>`;
        $('dialog-layer').hidden = false;
      }
    }
    window.buySkin = id => {
      const skin = SKINS.find(s => s.id === id);
      if(save.owned.includes(id)) { save.equipped = id; openDialog('shop'); }
      else if(save.coins >= skin.price) { save.coins -= skin.price; save.owned.push(id); save.equipped = id; updateEconomy(); openDialog('shop'); }
    };

    document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openDialog(b.dataset.open)));
    $('dialog-close').addEventListener('click', () => $('dialog-layer').hidden = true);
    $('brand-home').addEventListener('click', () => { document.body.dataset.state = 'menu'; $('over-screen').hidden = true; });

    // Moteur 3D Three.js
    let renderer, scene, camera, groundMesh, lavaMat, player;
    let obstacles = [], run = null, state = 'menu', clockTime = 0, playerY = 0;
    const LANES = [-3.2, 0, 3.2], PLAYER_Z = 5;

    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const sphereGeo = new THREE.IcosahedronGeometry(1, 1);

    function makeRunner(colorHex) {
      const rig = new THREE.Group();
      const suitMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: .7 });
      const body = new THREE.Mesh(boxGeo, suitMat);
      body.scale.set(.7, .8, .45); body.position.set(0, .8, 0); rig.add(body);
      const head = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ color: 0xd7aa89 }));
      head.scale.set(.32, .32, .32); head.position.set(0, 1.45, 0); rig.add(head);
      const hat = new THREE.Mesh(boxGeo, suitMat);
      hat.scale.set(.36, .2, .36); hat.position.set(0, 1.7, 0); rig.add(hat);
      return rig;
    }

    function initWorld() {
      renderer = new THREE.WebGLRenderer({ canvas: $('world'), antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f253e);
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, .1, 240);
      camera.position.set(0, 3.2, 11);
      camera.lookAt(0, 1, 0);

      scene.add(new THREE.HemisphereLight(0xd9ecff, 0x2c4b6b, 1.35));
      const sun = new THREE.DirectionalLight(0xfff1d6, 1.75); sun.position.set(-18, 30, 16); scene.add(sun);

      lavaMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main(){vUv=uv*40.0; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `uniform float uTime; varying vec2 vUv; void main(){ vec2 p=vUv; float wave=sin(p.x*2.0+uTime*2.5)*cos(p.y*2.0-uTime*3.0); vec3 col=mix(vec3(0.35,0.05,0.01),vec3(1.0,0.38,0.05),smoothstep(0.1,0.9,wave+0.5)); gl_FragColor=vec4(col,1.0); }`
      });

      groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(650, 650), new THREE.MeshStandardMaterial({ color: 0xdcebf7 }));
      groundMesh.rotation.x = -Math.PI / 2; scene.add(groundMesh);

      player = makeRunner(SKINS[0].color);
      player.position.set(0, 1, PLAYER_Z);
      scene.add(player);

      renderer.setAnimationLoop(animate);
    }

    function startGame() {
      obstacles.forEach(o => scene.remove(o.group)); obstacles = [];
      const mode = save.gameMode;
      groundMesh.material = mode === 'lava' ? lavaMat : new THREE.MeshStandardMaterial({ color: 0xdcebf7 });
      playerY = mode === 'lava' ? 1.6 : 1; player.position.set(0, playerY, PLAYER_Z);
      run = { mode, distance: 0, score: 0, coins: 0, lane: 1, speed: 18, elapsed: 0, lavaHeat: 0 };

      document.body.dataset.state = 'running';
      state = 'running';
    }

    function updateRun(dt) {
      run.elapsed += dt; run.speed = Math.min(18 + run.elapsed * .25, 38);
      const dz = run.speed * dt; run.distance += dz;
      player.position.x = THREE.MathUtils.damp(player.position.x, LANES[run.lane], 24, dt);

      if(run.mode === 'lava') {
        run.lavaHeat = Math.min(100, run.lavaHeat + dt * 20);
        $('lava-meter-fill').style.width = run.lavaHeat + '%';
        $('lava-meter').hidden = false;
      } else { $('lava-meter').hidden = true; }

      run.score = Math.floor(run.distance * 6 + run.coins * 10);
      $('score').textContent = String(run.score).padStart(5, '0');
      $('distance').textContent = Math.floor(run.distance);
      $('run-coins').textContent = run.coins;
    }

    function gameOver() {
      state = 'over';
      document.body.dataset.state = 'menu';
      $('final-score').textContent = fmt(run.score) + ' PTS';
      $('over-screen').hidden = false;
      if(window.saveScoreToFirebase) window.saveScoreToFirebase(save.username, run.score, run.mode);
    }

    document.addEventListener('keydown', e => {
      if(state !== 'running') return;
      if(e.key === 'ArrowLeft' || e.key === 'q') run.lane = clamp(run.lane - 1, 0, 2);
      if(e.key === 'ArrowRight' || e.key === 'd') run.lane = clamp(run.lane + 1, 0, 2);
    });

    $('start-button').addEventListener('click', startGame);
    $('restart-button').addEventListener('click', () => { $('over-screen').hidden = true; startGame(); });
    $('over-home').addEventListener('click', () => { $('over-screen').hidden = true; document.body.dataset.state = 'menu'; state = 'menu'; });

    function animate() {
      const dt = 0.016; clockTime += dt;
      if(state === 'running') updateRun(dt);
      if(lavaMat) lavaMat.uniforms.uTime.value = clockTime;
      renderer.render(scene, camera);
    }

    try { initWorld(); updateEconomy(); } catch(e) {}
  })();
  </script>
</body>
</html>
