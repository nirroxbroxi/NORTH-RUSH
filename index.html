<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173e35">
  <title>North Rush - Édition Complète & Firebase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root{
      --ink:#173e35;--lime:#d0fa78;--snow:#f1f6f3;--muted:#b9d1e4;
      --line:rgba(255,255,255,.18);--dark:#102d28;--cyan:#6ef7e8;--gold:#ffd257;--lava:#ff5a26;
      --display:'Barlow Condensed',Impact,sans-serif;--sans:'DM Sans',Arial,sans-serif;--mono:'Space Mono',monospace
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
    body{font-family:var(--sans);color:#f3f8fc;background:#0d2138;touch-action:none;-webkit-font-smoothing:antialiased}
    button{border:0;cursor:pointer}
    [hidden]{display:none!important}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    #world{position:fixed;inset:0;z-index:1;width:100vw;height:100vh;display:block;outline:none}
    
    /* Header */
    .site-header{position:fixed;z-index:30;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:20px 3vw;gap:14px;background:rgba(13,33,56,0.4);backdrop-filter:blur(8px)}
    .brand{display:flex;align-items:center;gap:10px;color:#f4f9fc;text-decoration:none;background:none;padding:0}
    .brand-mark{height:38px;width:38px;display:grid;place-items:center;background:var(--lime);border-radius:9px;transform:rotate(-5deg);color:var(--ink)}
    .brand-words{font-family:var(--display);font-size:20px;font-weight:800;line-height:.86}
    .guard-badge{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid rgba(110,247,232,.35);border-radius:999px;background:rgba(11,36,44,.76);color:#cffaf6;font-family:var(--mono);font-size:8.5px}
    .status-dot{height:6px;width:6px;background:var(--cyan);border-radius:50%}

    .site-nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:5px 7px;border-radius:12px;background:rgba(11,29,48,.72);border:1px solid rgba(255,255,255,.14)}
    .nav-button{background:transparent;padding:8px 13px;border-radius:8px;color:#c5daea;font-size:10px;font-weight:800}
    .nav-button:hover,.nav-button.active{color:var(--ink);background:var(--lime)}

    .header-actions{display:flex;align-items:center;gap:8px}
    .profile-chip{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;border-radius:9px;background:rgba(12,31,50,.82);border:1px solid rgba(255,255,255,.2);color:#f4f9fc}
    .wallet{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:1px solid rgba(255,255,255,.22);border-radius:9px;background:rgba(12,31,50,.76);color:#f5fafc}
    .icon-button{height:38px;width:38px;display:grid;place-items:center;background:rgba(12,31,50,.72);border:1px solid rgba(255,255,255,.16);color:#f3f8fc;border-radius:8px}
    .v2-preview-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:rgba(255,90,38,.25);border:1px solid rgba(255,90,38,.5);color:#ffb299;font-size:9px;font-weight:700}

    /* Hero Menu */
    .hero{position:fixed;z-index:20;left:3.6vw;top:52%;width:420px;padding:22px 25px;border-radius:18px;background:rgba(10,27,44,.85);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(15px);transform:translateY(-47%)}
    .eyebrow{font-size:9.5px;font-weight:800;letter-spacing:2px;color:var(--lime);margin-bottom:10px}
    h1{margin:0;font-family:var(--display);font-size:80px;font-weight:800;line-height:.82;color:#ffffff}.title-dot{color:var(--lime)}
    .hero-copy{font-size:13px;line-height:1.55;color:#d0e2f0;margin:11px 0 15px}
    .primary-button{height:54px;border-radius:9px;background:var(--lime);color:var(--ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:0 21px;width:100%}

    /* Modes */
    .mode-selector{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
    .mode-selector-label{font-family:var(--mono);font-size:8px;color:#9bbad0;margin-bottom:7px;display:flex;justify-content:space-between}
    .mode-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .mode-pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px 7px;text-align:left;color:#d6e7f5;cursor:pointer}
    .mode-pill.active{background:rgba(208,250,120,.16);border-color:var(--lime);color:#fff}
    .mode-pill-top{display:flex;justify-content:space-between;font-size:10px;font-weight:800}
    .mode-pill-desc{font-size:8.5px;color:#a5bfd4}

    /* HUD Course */
    #run-hud{position:fixed;inset:0;z-index:15;pointer-events:none;color:#ffffff}
    .score-wrap{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center}
    .score-label{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--lime)}
    .score-number{font-family:var(--display);font-size:54px;font-weight:700}
    #lava-meter{position:absolute;left:50%;top:138px;transform:translateX(-50%);width:220px;background:rgba(34,11,8,.84);border:1px solid rgba(255,107,61,.55);border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:8px}
    .lava-meter-track{flex:1;height:5px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
    .lava-meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffae33,#ff3311)}
    .run-coin-count{position:absolute;left:3.5vw;top:96px;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
    .distance-readout{position:absolute;bottom:64px;right:3.5vw;font-family:var(--mono);font-size:19px}

    /* Modales & Game Over */
    .screen-overlay{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(12,37,31,.42);backdrop-filter:blur(9px);padding:20px}
    .state-panel{width:455px;max-width:100%;padding:34px;background:var(--dark);color:#f2f7ea;border-radius:17px;border:1px solid rgba(255,255,255,.12)}
    .dialog{width:min(100%,1060px);max-height:calc(100dvh - 54px);overflow-y:auto;background:var(--dark);border:1px solid rgba(217,239,203,.14);border-radius:18px;padding:20px 28px 28px}
    .skin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
    .skin-card{background:#1a382f;border:1px solid #2c4b3b;border-radius:10px;padding:12px;text-align:center}
    .leaderboard-head,.leaderboard-row{display:grid;grid-template-columns:42px 1fr 96px 100px 76px;gap:10px;align-items:center}
    .leaderboard-head{font-size:8px;color:#849f89;padding:0 10px 10px;border-bottom:1px solid #34513d}
    .leaderboard-row{padding:12px 10px;border-bottom:1px solid #294734;font-size:11px}

    body[data-state="running"] .hero { display: none !important; }
    body[data-state="running"] .site-nav { display: none !important; }
    body[data-state="menu"] #run-hud { display: none !important; }
  </style>
</head>
<body data-state="menu">
  <!-- Symboles SVG -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden"><defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M3.34 7l17.32 10M3.34 17 20.66 7M8.5 4l3.5 3 3.5-3M8.5 20l3.5-3 3.5 3M3.3 11l4.3-1.5L8 5M16 19l.4-4.5 4.3-1.5M3.3 13l4.3 1.5L8 19M16 5l.4 4.5 4.3 1.5"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6"/><path d="m12 8 1.2 2.8 2.8 1.2-2.8 1.2L12 16l-1.2-2.8L8 12l2.8-1.2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v6a5 5 0 0 1-10 0ZM7 5H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4m-5 2v6m-5 1h10m-8-1 1-4h4l1 4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </defs></svg>

  <canvas id="world"></canvas>

  <!-- En-tête -->
  <header class="site-header">
    <div style="display:flex;align-items:center;gap:14px">
      <button class="brand" id="brand-home">
        <span class="brand-mark"><svg viewBox="0 0 40 40" style="width:24px;height:24px"><path d="M7 31 19 7h5l10 24H23l-5-12-6 12Z" fill="currentColor"/></svg></span>
        <span class="brand-words">NORTH<br>RUSH</span>
      </button>
      <div class="guard-badge"><span class="status-dot"></span>NORTHGUARD™ ACTIF</div>
    </div>

    <nav class="site-nav">
      <button class="nav-button active" data-open="home">JOUER</button>
      <button class="nav-button" data-open="shop">BOUTIQUE</button>
    </nav>

    <div class="header-actions">
      <button class="v2-preview-btn" id="v2-preview-toggle">🎉 APERÇU V2 / 1ER JANVIER</button>
      <div class="profile-chip">🐧 <span id="hdr-username">Invité Polaire</span></div>
      <div class="wallet"><svg class="icon"><use href="#i-coin"/></svg><span data-balance>350</span></div>
      <button class="icon-button" data-open="scores"><svg class="icon"><use href="#i-trophy"/></svg></button>
    </div>
  </header>

  <!-- Accueil -->
  <main class="hero" id="home-screen">
    <div class="eyebrow"><svg class="icon" style="width:14px;height:14px"><use href="#i-snow"/></svg>SAISON VOLCANIQUE & V2 JANVIER</div>
    <h1>NORTH<br>RUSH<span class="title-dot">.</span></h1>
    <p class="hero-copy">Survole la lave en fusion et prépare-toi pour la V2 du 1er Janvier !</p>
    <button class="primary-button" id="start-button">
      <span style="display:flex;align-items:center;gap:10px"><svg class="icon"><use href="#i-play"/></svg><span>C'EST PARTI</span></span>
      <svg class="icon"><use href="#i-right"/></svg>
    </button>

    <div class="mode-selector">
      <div class="mode-selector-label"><span>MODE DE JEU</span><span id="mode-summary">CLASSIQUE</span></div>
      <div class="mode-pills">
        <button class="mode-pill active" data-mode="classic"><div class="mode-pill-top"><span>❄️ Classique</span><span>×1</span></div><div class="mode-pill-desc">Rails enneigés.</div></button>
        <button class="mode-pill" data-mode="nocoin"><div class="mode-pill-top"><span>🚫 Sans Pièce</span><span>×2</span></div><div class="mode-pill-desc">Saut barrière.</div></button>
        <button class="mode-pill" data-mode="lava"><div class="mode-pill-top"><span>🌋 Floor is Lava</span><span>×2.5</span></div><div class="mode-pill-desc">Vraie lave !</div></button>
      </div>
    </div>
  </main>

  <!-- HUD de course -->
  <div id="run-hud">
    <div class="score-wrap">
      <div class="score-label">SCORE</div>
      <div class="score-number" id="score">00000</div>
    </div>
    <div id="lava-meter" hidden><div class="lava-meter-track"><div class="lava-meter-fill" id="lava-meter-fill"></div></div></div>
    <div class="run-coin-count"><svg class="icon"><use href="#i-coin"/></svg><span id="run-coins">0</span></div>
    <div class="distance-readout"><b id="distance">0</b><span>M</span></div>
  </div>

  <div id="event-banner" hidden style="position:fixed;top:98px;left:50%;transform:translateX(-50%);z-index:31;background:#2c1d4d;color:#e5d7ff;padding:7px 12px;border-radius:7px;font-size:9px">🎉 ÉVÉNEMENT V2 : BONNE ANNÉE 2027</div>

  <!-- Game Over -->
  <div class="screen-overlay" id="over-screen" hidden>
    <section class="state-panel">
      <h2 style="font-family:var(--display);font-size:40px;margin:0 0 10px">FIN DE COURSE</h2>
      <div style="font-size:44px;font-weight:700;color:var(--lime);margin:15px 0" id="final-score">0 PTS</div>
      <button class="primary-button" id="restart-button">REJOUER</button>
      <button id="over-home" style="width:100%;margin-top:10px;background:rgba(255,255,255,.05);color:#fff;padding:12px;border-radius:8px;font-weight:700">ACCUEIL</button>
    </section>
  </div>

  <!-- Modale -->
  <div class="screen-overlay" id="dialog-layer" hidden>
    <section class="dialog">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <span id="dialog-kicker" style="font-size:9px;color:var(--lime);letter-spacing:2px"></span>
        <button id="dialog-close" style="background:none;color:#fff;font-size:18px"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div id="dialog-content"></div>
    </section>
  </div>

  <!-- Script Firebase -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB_3kk4QDjUwNbiZvw3F7zhIrDkU-GIrj4",
      authDomain: "north-rush-a88b5.firebaseapp.com",
      projectId: "north-rush-a88b5",
      storageBucket: "north-rush-a88b5.firebasestorage.app",
      messagingSenderId: "796135776651",
      appId: "1:796135776651:web:54131c29c023f1b641cf8e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveScoreToFirebase = async function(username, score, mode) {
      try {
        await addDoc(collection(db, "scores"), { name: username, score, mode, date: Date.now() });
      } catch (e) {}
    };

    window.loadFirebaseLeaderboard = async function() {
      try {
        const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(10));
        const snapshot = await getDocs(q);
        const list = [];
        snapshot.forEach(doc => list.push(doc.data()));
        return list;
      } catch (e) { return []; }
    };
  </script>

  <!-- Script Jeu -->
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const fmt = n => Math.floor(n).toLocaleString('fr-FR');
    const clamp = (n,a,b) => Math.max(a,Math.min(b,n));

    const SKINS = [
      {id:'frost',name:"P'tit Givré",price:0,color:0xcf493f,emoji:'🐧'},
      {id:'evergreen',name:'Lutin Express',price:600,color:0x4c986c,emoji:'🎄'},
      {id:'yeti',name:'Yéti Blanc',price:1100,color:0xe4eff7,emoji:'❄️'},
      {id:'magma',name:'Magma Core',price:1600,color:0xff511a,emoji:'🌋'}
    ];

    let save = { username: 'Invité Polaire', coins: 350, equipped: 'frost', owned: ['frost'], gameMode: 'classic' };

    $('v2-preview-toggle').addEventListener('click', () => {
      const active = !$('event-banner').hidden;
      $('event-banner').hidden = active;
      $('v2-preview-toggle').style.background = active ? 'rgba(255,90,38,.25)' : '#ffd700';
      $('v2-preview-toggle').style.color = active ? '#ffb299' : '#102d28';
    });

    document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
      save.gameMode = b.dataset.mode;
      document.querySelectorAll('.mode-pill').forEach(p => p.classList.toggle('active', p.dataset.mode === save.gameMode));
      $('mode-summary').textContent = save.gameMode === 'lava' ? 'FLOOR IS LAVA' : save.gameMode === 'nocoin' ? 'SANS PIÈCE' : 'CLASSIQUE';
    }));

    function openDialog(which) {
      if(which === 'scores') {
        $('dialog-kicker').textContent = 'CLASSEMENT MONDIAL';
        $('dialog-content').innerHTML = 'Chargement...';
        $('dialog-layer').hidden = false;
        window.loadFirebaseLeaderboard().then(board => {
          $('dialog-content').innerHTML = `<div class="leaderboard-head"><span>RANG</span><span>JOUEUR</span><span>SCORE</span><span>MODE</span><span style="text-align:right">DATE</span></div>` +
          board.map((r,i) => `<div class="leaderboard-row"><span style="color:var(--lime)">#${i+1}</span><span>${r.name}</span><span style="font-weight:700">${fmt(r.score)}</span><span>${r.mode}</span><span style="text-align:right">${new Date(r.date).toLocaleDateString()}</span></div>`).join('');
        });
      } else if(which === 'shop') {
        $('dialog-kicker').textContent = 'BOUTIQUE';
        $('dialog-content').innerHTML = `<div class="skin-grid">${SKINS.map(s => `
          <div class="skin-card">
            <div style="font-size:32px;margin-bottom:8px">${s.emoji}</div>
            <div style="font-size:12px;font-weight:700;margin-bottom:8px">${s.name}</div>
            <button style="width:100%;padding:6px;background:var(--lime);color:var(--ink);border-radius:4px;font-weight:700">${s.price===0?'ÉQUIPÉ':s.price+' 💰'}</button>
          </div>`).join('')}</div>`;
        $('dialog-layer').hidden = false;
      }
    }

    document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openDialog(b.dataset.open)));
    $('dialog-close').addEventListener('click', () => $('dialog-layer').hidden = true);
    $('brand-home').addEventListener('click', () => { document.body.dataset.state = 'menu'; $('over-screen').hidden = true; });

    // 3D Three.js Moteur avec le Vrai Skin Personnage 3D
    let renderer, scene, camera, groundMesh, lavaMat, player;
    let obstacles = [], run = null, state = 'menu', clockTime = 0, playerY = 0;
    const LANES = [-3.2, 0, 3.2], PLAYER_Z = 5;

    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const sphereGeo = new THREE.IcosahedronGeometry(1, 1);

    function makeRunner(colorHex) {
      const rig = new THREE.Group();
      const suitMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: .7 });
      
      // Corps
      const body = new THREE.Mesh(boxGeo, suitMat);
      body.scale.set(.7, .8, .45); body.position.set(0, .8, 0); rig.add(body);
      
      // Tête
      const head = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({ color: 0xd7aa89 }));
      head.scale.set(.32, .32, .32); head.position.set(0, 1.45, 0); rig.add(head);
      
      // Chapeau / Casquette
      const hat = new THREE.Mesh(boxGeo, suitMat);
      hat.scale.set(.36, .2, .36); hat.position.set(0, 1.7, 0); rig.add(hat);

      return rig;
    }

    function initWorld() {
      renderer = new THREE.WebGLRenderer({ canvas: $('world'), antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f253e);
      
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, .1, 240);
      camera.position.set(0, 3.2, 11);
      camera.lookAt(0, 1, 0);

      scene.add(new THREE.HemisphereLight(0xd9ecff, 0x2c4b6b, 1.35));
      const sun = new THREE.DirectionalLight(0xfff1d6, 1.75); sun.position.set(-18, 30, 16); scene.add(sun);

      lavaMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main(){vUv=uv*40.0; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `uniform float uTime; varying vec2 vUv; void main(){ vec2 p=vUv; float wave=sin(p.x*2.0+uTime*2.5)*cos(p.y*2.0-uTime*3.0); vec3 col=mix(vec3(0.35,0.05,0.01),vec3(1.0,0.38,0.05),smoothstep(0.1,0.9,wave+0.5)); gl_FragColor=vec4(col,1.0); }`
      });

      groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(650, 650), new THREE.MeshStandardMaterial({ color: 0xdcebf7 }));
      groundMesh.rotation.x = -Math.PI / 2; scene.add(groundMesh);

      player = makeRunner(SKINS[0].color);
      player.position.set(0, 0, PLAYER_Z);
      scene.add(player);

      renderer.setAnimationLoop(animate);
    }

    function startGame() {
      obstacles.forEach(o => scene.remove(o.group)); obstacles = [];
      const mode = save.gameMode;
      groundMesh.material = mode === 'lava' ? lavaMat : new THREE.MeshStandardMaterial({ color: 0xdcebf7 });
      playerY = mode === 'lava' ? .6 : 0; player.position.set(0, playerY, PLAYER_Z);
      run = { mode, distance: 0, score: 0, coins: 0, lane: 1, speed: 18, elapsed: 0, lavaHeat: 0 };

      document.body.dataset.state = 'running';
      state = 'running';
    }

    function updateRun(dt) {
      run.elapsed += dt; run.speed = Math.min(18 + run.elapsed * .25, 38);
      const dz = run.speed * dt; run.distance += dz;
      player.position.x = THREE.MathUtils.damp(player.position.x, LANES[run.lane], 24, dt);

      if(run.mode === 'lava') {
        run.lavaHeat = Math.min(100, run.lavaHeat + dt * 20);
        $('lava-meter-fill').style.width = run.lavaHeat + '%';
        $('lava-meter').hidden = false;
      } else { $('lava-meter').hidden = true; }

      run.score = Math.floor(run.distance * 6 + run.coins * 10);
      $('score').textContent = String(run.score).padStart(5, '0');
      $('distance').textContent = Math.floor(run.distance);
      $('run-coins').textContent = run.coins;
    }

    document.addEventListener('keydown', e => {
      if(state !== 'running') return;
      if(e.key === 'ArrowLeft' || e.key === 'q') run.lane = clamp(run.lane - 1, 0, 2);
      if(e.key === 'ArrowRight' || e.key === 'd') run.lane = clamp(run.lane + 1, 0, 2);
    });

    $('start-button').addEventListener('click', startGame);
    $('restart-button').addEventListener('click', () => { $('over-screen').hidden = true; startGame(); });
    $('over-home').addEventListener('click', () => { $('over-screen').hidden = true; document.body.dataset.state = 'menu'; state = 'menu'; });

    function animate() {
      const dt = 0.016; clockTime += dt;
      if(state === 'running') updateRun(dt);
      if(lavaMat) lavaMat.uniforms.uTime.value = clockTime;
      renderer.render(scene, camera);
    }

    try { initWorld(); } catch(e) {}
  })();
  </script>
</body>
</html>
